server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolution DNS differee (au moment de la requete, via le resolveur
    # interne de Docker) plutot qu'au demarrage de nginx. Sans ca, nginx
    # refuse de demarrer si le conteneur "backend" n'est pas encore pret
    # au moment exact ou nginx tente de resoudre son nom une seule fois.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
